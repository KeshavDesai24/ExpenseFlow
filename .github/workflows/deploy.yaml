name: CI-CD

on:
  push:
    branches:
      - main
      - keshav

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Docker Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build API
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/expense-api:latest ./api-service

    - name: Push API
      run: docker push ${{ secrets.DOCKER_USERNAME }}/expense-api:latest

    - name: Build Worker
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/expense-worker:latest ./worker-service

    - name: Push Worker
      run: docker push ${{ secrets.DOCKER_USERNAME }}/expense-worker:latest

